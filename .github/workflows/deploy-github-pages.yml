# Deploy Staff Travel app to GitHub Pages (static SPA)
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Prepare Pages folder
        run: |
          mkdir -p _site
          # Client assets live in dist/client for TanStack Start; fall back to dist
          if [ -d dist/client ]; then
            cp -r dist/client/. _site/
          else
            cp -r dist/. _site/
          fi
          # SPA shell is _shell.html — GitHub Pages needs index.html + 404.html
          if [ -f _site/_shell.html ]; then
            cp _site/_shell.html _site/index.html
            cp _site/_shell.html _site/404.html
          elif [ -f _site/index.html ]; then
            cp _site/index.html _site/404.html
          fi
          # Avoid Jekyll filtering of files that start with _
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
